<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>数据浏览</title>
    <style>
        body { font-family: Arial; background: #1a1a2e; color: #fff; padding: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #16213e; padding: 10px; text-align: left; }
        td { padding: 8px; border-bottom: 1px solid #333; }
        tr:hover { background: #16213e; }
        .pagination { margin-top: 20px; display: flex; gap: 10px; align-items: center; }
        .pagination button { padding: 8px 16px; background: #e94560; color: #fff; border: none; cursor: pointer; border-radius: 6px; }
        .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }
        .search-box { margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
        .search-box input, .search-box select { padding: 10px; border-radius: 6px; border: 1px solid #333; background: #16213e; color: #fff; }
        .search-box button { padding: 10px 24px; background: #e94560; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
        .stats { margin-bottom: 10px; color: #888; }
        .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; background: #333; }
        .badge.pop { background: #e94560; }
    </style>
</head>
<body>
    <h1>🎵 数据浏览</h1>
    <p style="color:#888;">Qdrant 中的歌曲数据</p>

    <div class="search-box">
        <input id="q" placeholder="搜索歌曲名..." />
        <input id="artist" placeholder="搜索歌手..." />
        <select id="genre">
            <option value="">全部流派</option>
            <option value="pop">Pop</option>
            <option value="rock">Rock</option>
            <option value="jazz">Jazz</option>
            <option value="electronic">Electronic</option>
            <option value="hip-hop">Hip-Hop</option>
        </select>
        <button onclick="loadData()">搜索</button>
        <button onclick="loadData(true)">🔄 刷新</button>
    </div>

    <div class="stats" id="stats">加载中...</div>

    <div style="overflow-x:auto;">
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>歌曲名</th>
                    <th>歌手</th>
                    <th>流派</th>
                    <th>热度</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="5" style="text-align:center;color:#888;">加载中...</td></tr>
            </tbody>
        </table>
    </div>

    <div class="pagination">
        <button id="prevBtn" onclick="prevPage()">上一页</button>
        <span id="pageInfo">1 / 1</span>
        <button id="nextBtn" onclick="nextPage()">下一页</button>
        <select id="limitSelect" onchange="loadData()">
            <option value="20">20条</option>
            <option value="50">50条</option>
            <option value="100">100条</option>
        </select>
    </div>

    <script>
        let currentPage = 1;
        let totalPages = 1;
        let currentData = [];

        function loadData(resetPage = true) {
            if (resetPage) currentPage = 1;

            const q = document.getElementById('q').value.trim();
            const artist = document.getElementById('artist').value.trim();
            const genre = document.getElementById('genre').value;
            const limit = document.getElementById('limitSelect').value;

            let url = `/api/data/?page=${currentPage}&limit=${limit}`;
            if (q) url += `&q=${encodeURIComponent(q)}`;
            if (artist) url += `&artist=${encodeURIComponent(artist)}`;
            if (genre) url += `&genre=${encodeURIComponent(genre)}`;

            document.getElementById('tableBody').innerHTML = '<tr><td colspan="5" style="text-align:center;color:#888;">加载中...</td></tr>';

            fetch(url)
                .then(res => res.json())
                .then(data => {
                    if (data.error) {
                        document.getElementById('tableBody').innerHTML = `<tr><td colspan="5" style="text-align:center;color:#d48a8a;">${data.error}</td></tr>`;
                        return;
                    }
                    currentData = data.results || [];
                    totalPages = data.total_pages || 1;
                    renderTable(currentData, data.page, data.limit);
                    updatePagination(data.page, totalPages);
                    document.getElementById('stats').textContent = `共 ${data.total || 0} 条记录`;
                })
                .catch(err => {
                    document.getElementById('tableBody').innerHTML = `<tr><td colspan="5" style="text-align:center;color:#d48a8a;">请求失败: ${err.message}</td></tr>`;
                });
        }

        function renderTable(data, page, limit) {
            if (!data || data.length === 0) {
                document.getElementById('tableBody').innerHTML = '<tr><td colspan="5" style="text-align:center;color:#888;">暂无数据</td></tr>';
                return;
            }

            let html = '';
            const start = (page - 1) * limit;
            data.forEach((item, i) => {
                const genres = item.artist_genres ? item.artist_genres.split(',').slice(0, 2).join(', ') : '-';
                const pop = item.popularity ? Math.round(item.popularity * 100) : 0;
                const popClass = pop > 70 ? 'badge pop' : 'badge';
                html += `
                    <tr>
                        <td>${start + i + 1}</td>
                        <td><strong>${escapeHtml(item.track_name)}</strong></td>
                        <td>${escapeHtml(item.artist_name)}</td>
                        <td><span class="badge">${escapeHtml(genres)}</span></td>
                        <td><span class="${popClass}">${pop}%</span></td>
                    </tr>
                `;
            });
            document.getElementById('tableBody').innerHTML = html;
        }

        function escapeHtml(text) {
            if (!text) return '-';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function updatePagination(page, total) {
            document.getElementById('pageInfo').textContent = `${page} / ${total}`;
            document.getElementById('prevBtn').disabled = page <= 1;
            document.getElementById('nextBtn').disabled = page >= total;
        }

        function prevPage() {
            if (currentPage > 1) { currentPage--; loadData(false); }
        }

        function nextPage() {
            if (currentPage < totalPages) { currentPage++; loadData(false); }
        }

        // Enter 键触发搜索
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('q').addEventListener('keydown', (e) => { if (e.key === 'Enter') loadData(); });
            document.getElementById('artist').addEventListener('keydown', (e) => { if (e.key === 'Enter') loadData(); });
            loadData();
        });
    </script>
</body>
</html>
