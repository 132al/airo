<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --punch-red: #e63946ff;
            --honeydew: #f1faeeff;
            --frosted-blue: #a8dadcff;
            --cerulean: #457b9dff;
            --oxford-navy: #1d3557ff;
            --bg-deep: var(--oxford-navy);
            --bg-surface: #1f2f4a;
            --bg-card: rgba(255, 255, 255, 0.04);
            --bg-card-hover: rgba(255, 255, 255, 0.08);
            --border-subtle: rgba(255, 255, 255, 0.06);
            --text-primary: var(--honeydew);
            --text-secondary: rgba(241, 250, 238, 0.70);
            --text-muted: rgba(241, 250, 238, 0.35);
            --accent: var(--punch-red);
            --accent-glow: rgba(230, 57, 70, 0.20);
            --radius-card: 16px;
            --radius-pill: 60px;
            --transition: 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image:
                radial-gradient(circle at 20px 20px, rgba(168, 218, 220, 0.10) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse at 15% 15%, rgba(230, 57, 70, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 85% 85%, rgba(69, 123, 157, 0.14) 0%, transparent 50%);
            pointer-events: none;
        }
        .app {
            max-width: 720px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .brand h1 {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }
        .brand h1 span {
            color: var(--frosted-blue);
            font-weight: 300;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .user-badge {
            font-size: 12px;
            color: var(--text-secondary);
            background: var(--bg-card);
            padding: 4px 14px;
            border-radius: var(--radius-pill);
            border: 1px solid var(--border-subtle);
        }
        .logout-btn {
            font-size: 12px;
            color: var(--text-muted);
            background: var(--bg-card);
            padding: 4px 14px;
            border-radius: var(--radius-pill);
            border: 1px solid var(--border-subtle);
            text-decoration: none;
            cursor: pointer;
            transition: var(--transition);
        }
        .logout-btn:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
            border-color: var(--frosted-blue);
        }

        /* ===== 搜索区 ===== */
        .search-box {
            position: relative;
            margin-bottom: 16px;
        }
        .search-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .search-row input {
            flex: 1;
            min-width: 120px;
            padding: 10px 16px;
            border-radius: var(--radius-pill);
            border: 1px solid var(--border-subtle);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: var(--transition);
        }
        .search-row input::placeholder {
            color: var(--text-muted);
        }
        .search-row input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .search-row button {
            padding: 10px 22px;
            border: none;
            border-radius: var(--radius-pill);
            background: var(--accent);
            color: var(--honeydew);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            flex-shrink: 0;
        }
        .search-row button:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        /* ===== 候选框 ===== */
        .candidate-dropdown {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
            z-index: 50;
            max-height: 320px;
            overflow-y: auto;
            display: none;
        }
        .candidate-dropdown.open {
            display: block;
        }
        .candidate-item {
            padding: 10px 16px;
            cursor: pointer;
            border-bottom: 1px solid var(--border-subtle);
            transition: background 0.15s;
        }
        .candidate-item:last-child {
            border-bottom: none;
        }
        .candidate-item:hover {
            background: var(--bg-card-hover);
        }
        .candidate-item .cand-name {
            font-size: 14px;
            color: var(--text-primary);
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .candidate-item .cand-sub {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .candidate-empty {
            padding: 14px 16px;
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
        }

        .quick-chips {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .quick-chips span {
            padding: 6px 16px;
            border-radius: var(--radius-pill);
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition);
        }
        .quick-chips span:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
            border-color: var(--frosted-blue);
        }

        .recommendation-area {
            background: rgba(255, 255, 255, 0.02);
            border-radius: var(--radius-card);
            border: 1px solid var(--border-subtle);
            padding: 20px 24px 24px;
            min-height: 200px;
            transition: var(--transition);
            position: relative;
            backdrop-filter: blur(2px);
        }
        .recommendation-area .placeholder {
            color: var(--text-muted);
            text-align: center;
            padding: 30px 0;
        }
        .recommendation-area .placeholder .icon {
            font-size: 36px;
            margin-bottom: 10px;
            opacity: 0.25;
        }
        .recommendation-area .placeholder p {
            font-size: 15px;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            color: var(--text-muted);
            font-size: 13px;
        }

        .reason-box {
            background: rgba(168, 218, 220, 0.06);
            border-left: 3px solid var(--frosted-blue);
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 12px;
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.6;
            min-height: 44px;
        }
        .reason-box .reason-loading {
            color: var(--text-muted);
            font-style: italic;
        }

        .song-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 12px;
            border: 1px solid var(--border-subtle);
            transition: var(--transition);
        }
        .song-card:hover {
            border-color: rgba(168, 218, 220, 0.15);
            background: rgba(255, 255, 255, 0.05);
        }
        .song-card .song-link {
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            color: inherit;
        }
        .song-card .song-info {
            min-width: 0;
            flex: 1;
        }
        .song-card .song-name {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .song-card .song-artist {
            font-size: 14px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .song-card .song-genres {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .song-card .song-score {
            font-size: 22px;
            font-weight: 600;
            color: var(--frosted-blue);
            flex-shrink: 0;
            margin-left: 16px;
        }
        .no-link-hint {
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
            margin-top: -6px;
            margin-bottom: 12px;
            font-style: italic;
        }

        /* ===== 反馈按钮三态 ===== */
        .feedback-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 12px;
        }
        .feedback-row button {
            padding: 8px 20px;
            border-radius: var(--radius-pill);
            border: 1px solid var(--border-subtle);
            background: var(--bg-card);
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition);
        }
        .feedback-row button:hover:not(:disabled) {
            background: var(--bg-card-hover);
            color: var(--text-primary);
            border-color: var(--frosted-blue);
        }
        .feedback-row button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .feedback-row button.active-like {
            background: rgba(74, 222, 128, 0.15);
            border-color: #4ade80;
            color: #4ade80;
            opacity: 1;
            cursor: not-allowed;
        }
        .feedback-row button.active-dislike {
            background: rgba(230, 57, 70, 0.15);
            border-color: var(--accent);
            color: var(--accent);
            opacity: 1;
            cursor: not-allowed;
        }
        .feedback-row button.undo-btn {
            color: var(--text-muted);
        }
        .feedback-row button.undo-btn.hidden {
            visibility: hidden;
            pointer-events: none;
        }

        /* ===== 翻页控件 ===== */
        .pager {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin-top: 16px;
        }
        .pager button {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid var(--border-subtle);
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 18px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pager button:hover:not(:disabled) {
            background: var(--accent);
            border-color: var(--accent);
            box-shadow: 0 4px 20px var(--accent-glow);
            transform: scale(1.05);
        }
        .pager button:disabled {
            opacity: 0.25;
            cursor: not-allowed;
        }
        .pager .page-info {
            font-size: 14px;
            color: var(--text-secondary);
            min-width: 80px;
            text-align: center;
        }

        .seed-info {
            margin-top: 10px;
            font-size: 11px;
            color: var(--text-muted);
            text-align: right;
            border-top: 1px solid var(--border-subtle);
            padding-top: 8px;
        }

        .loading-text {
            color: var(--text-muted);
            text-align: center;
            padding: 30px 0;
        }
        .loading-text .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 2px solid var(--border-subtle);
            border-top: 2px solid var(--frosted-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .error-text {
            color: #d48a8a;
            text-align: center;
            padding: 30px 0;
        }

        @media (max-width: 600px) {
            body { padding: 16px; }
            .header { flex-direction: column; align-items: flex-start; gap: 8px; }
            .search-row { flex-direction: column; }
            .search-row input { width: 100%; }
            .search-row button { justify-content: center; }
            .recommendation-area { padding: 16px; }
            .song-card .song-name { font-size: 16px; }
        }
    </style>
</head>
<body>
    <div class="app">

        <header class="header">
            <div class="brand">
                <h1>真值推荐 <span>· 音乐探索</span></h1>
            </div>
            <div class="header-right">
                <span class="user-badge">{{ request.user.username }}</span>
                <a href="/feedback/" class="logout-btn">反馈记录</a>
                <a href="/logout/" class="logout-btn">登出</a>
            </div>
        </header>

        <div class="search-box">
            <div class="search-row">
                <input id="trackInput" type="text" placeholder="歌曲名，如 Shape of You" autocomplete="off" />
                <input id="artistInput" type="text" placeholder="歌手（可选）" autocomplete="off" />
                <button onclick="startRecommend()">探索</button>
            </div>
            <div id="candidateDropdown" class="candidate-dropdown"></div>
        </div>

        <div class="quick-chips">
            <span onclick="quickSearch('Shape of You', 'Ed Sheeran')">Shape of You</span>
            <span onclick="quickSearch('Blinding Lights', 'The Weeknd')">Blinding Lights</span>
            <span onclick="quickSearch('Bohemian Rhapsody', 'Queen')">Bohemian Rhapsody</span>
            <span onclick="quickSearch('Die With A Smile', 'Lady Gaga')">Die With A Smile</span>
        </div>

        <div class="recommendation-area" id="mainArea">
            <div class="placeholder">
                <div class="icon">♫</div>
                <p>输入一首歌，开始探索</p>
            </div>
        </div>

    </div>

    <script>
        let currentResults = [];
        let currentIndex = 0;
        let currentQuery = '';
        let currentSeed = null;
        let candidateTimer = null;
        let candidateAbort = null;

        function startRecommend() {
            const track = document.getElementById('trackInput').value.trim();
            const artist = document.getElementById('artistInput').value.trim();
            if (!track) { alert('请输入歌曲名'); return; }
            closeDropdown();
            doRecommend(track, artist);
        }

        function quickSearch(track, artist) {
            document.getElementById('trackInput').value = track;
            document.getElementById('artistInput').value = artist || '';
            closeDropdown();
            doRecommend(track, artist || '');
        }

        function doRecommend(track, artist) {
            const container = document.getElementById('mainArea');
            container.innerHTML = `<div class="loading-text"><span class="spinner"></span>搜索中...</div>`;

            let url = `/api/recommend/?q=${encodeURIComponent(track)}&top_k=20`;
            if (artist) {
                url += `&artist=${encodeURIComponent(artist)}`;
            }

            fetch(url)
                .then(res => {
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    return res.json();
                })
                .then(data => {
                    if (data.error) {
                        container.innerHTML = `<div class="error-text">${escapeHtml(data.error)}</div>`;
                        return;
                    }
                    if (!data.results || data.results.length === 0) {
                        container.innerHTML = '<div class="placeholder"><div class="icon">♫</div><p>没有找到相似歌曲</p></div>';
                        return;
                    }
                    currentResults = data.results;
                    currentIndex = 0;
                    currentQuery = track;
                    currentSeed = data.seed;

                    currentResults.forEach(r => {
                        r._reason = '';
                        r._feedback = r._feedback || '';
                    });

                    renderSong(container);
                })
                .catch(err => {
                    container.innerHTML = `<div class="error-text">请求失败: ${escapeHtml(err.message)}</div>`;
                    console.error(err);
                });
        }

        function renderSong(container) {
            const item = currentResults[currentIndex];
            const total = currentResults.length;
            const pct = (item.similarity * 100).toFixed(1);
            const neteaseUrl = item.netease_url || '';
            const fb = item._feedback || '';

            const cardContent = `
                <div class="song-info">
                    <div class="song-name">${escapeHtml(item.track_name)}</div>
                    <div class="song-artist">${escapeHtml(item.artist_name)}</div>
                    <div class="song-genres">${escapeHtml(item.artist_genres || '未知流派')}</div>
                </div>
                <div class="song-score">${pct}%</div>
            `;

            const cardHtml = neteaseUrl
                ? `<a class="song-link" href="${escapeHtml(neteaseUrl)}" target="_blank" rel="noopener">${cardContent}</a>`
                : `<div class="song-link">${cardContent}</div>`;
            const noLinkHint = !neteaseUrl
                ? `<div class="no-link-hint">网易云暂无此歌曲的匹配结果</div>`
                : '';

            let reasonInner = '';
            if (item._reason) {
                reasonInner = escapeHtml(item._reason);
            } else {
                reasonInner = '<span class="reason-loading">正在生成推荐理由...</span>';
            }

            const likeClass = fb === 'like' ? 'active-like' : '';
            const dislikeClass = fb === 'dislike' ? 'active-dislike' : '';
            const likeDisabled = fb === 'like' ? 'disabled' : '';
            const dislikeDisabled = fb === 'dislike' ? 'disabled' : '';
            const undoHidden = fb ? '' : 'hidden';

            let html = `
                <div class="result-header">
                    <span>与《${escapeHtml(currentQuery)}》相似的歌曲</span>
                    <span>${currentIndex + 1} / ${total}</span>
                </div>
                <div class="reason-box" id="reasonBox">${reasonInner}</div>
                <div class="song-card">${cardHtml}${noLinkHint}</div>
                <div class="pager">
                    <button onclick="prevSong()" ${currentIndex === 0 ? 'disabled' : ''}>‹</button>
                    <span class="page-info">${currentIndex + 1} / ${total}</span>
                    <button onclick="nextSong()" ${currentIndex >= total - 1 ? 'disabled' : ''}>›</button>
                </div>
                <div class="feedback-row">
                    <button class="${likeClass}" ${likeDisabled} onclick="sendFeedback('like')">喜欢</button>
                    <button class="${dislikeClass}" ${dislikeDisabled} onclick="sendFeedback('dislike')">不喜欢</button>
                    <button class="undo-btn ${undoHidden}" onclick="sendFeedback('undo')">撤销</button>
                </div>
            `;

            if (currentSeed) {
                html += `
                    <div class="seed-info">
                        种子: ${escapeHtml(currentSeed.track_name)} - ${escapeHtml(currentSeed.artist_name)}
                        (流派: ${escapeHtml(currentSeed.artist_genres)})
                    </div>
                `;
            }

            container.innerHTML = html;

            if (!item._reason) {
                loadReasonForCurrentSong();
            }
        }

        function sendFeedback(feedback) {
            const item = currentResults[currentIndex];
            if (!item) return;

            const prev = item._feedback || '';

            item._feedback = feedback === 'undo' ? '' : feedback;
            renderSong(document.getElementById('mainArea'));

            fetch('/api/feedback/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    track_id: item.track_id || '',
                    track_name: item.track_name,
                    artist_name: item.artist_name,
                    artist_genres: item.artist_genres,
                    feedback: feedback,
                }),
            })
            .then(res => {
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return res.json();
            })
            .then(data => {
                if (data.error) {
                    item._feedback = prev;
                    renderSong(document.getElementById('mainArea'));
                    alert('反馈失败: ' + data.error);
                }
            })
            .catch(err => {
                item._feedback = prev;
                renderSong(document.getElementById('mainArea'));
                console.error('反馈失败:', err);
            });
        }

        function loadReasonForCurrentSong() {
            const item = currentResults[currentIndex];
            if (!item) return;
            if (item._reason) return;
            if (item._loading) return;
            item._loading = true;

            fetch('/api/reason/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    seed_track: currentQuery,
                    seed_artist: currentSeed ? currentSeed.artist_name : '',
                    seed_genres: currentSeed ? currentSeed.artist_genres : '',
                    track_name: item.track_name,
                    artist_name: item.artist_name,
                    artist_genres: item.artist_genres,
                    similarity: item.similarity,
                }),
            })
            .then(res => res.json())
            .then(data => {
                item._loading = false;
                if (data.reason) {
                    item._reason = data.reason;
                    const box = document.getElementById('reasonBox');
                    if (box && currentResults[currentIndex] === item) {
                        box.innerHTML = escapeHtml(data.reason);
                    }
                } else {
                    const box = document.getElementById('reasonBox');
                    if (box && currentResults[currentIndex] === item) {
                        box.innerHTML = '';
                    }
                }
            })
            .catch(err => {
                item._loading = false;
                console.error('理由加载失败:', err);
                const box = document.getElementById('reasonBox');
                if (box && currentResults[currentIndex] === item) {
                    box.innerHTML = '';
                }
            });
        }

        function prevSong() {
            if (currentIndex > 0) {
                currentIndex--;
                renderSong(document.getElementById('mainArea'));
            }
        }

        function nextSong() {
            if (currentIndex < currentResults.length - 1) {
                currentIndex++;
                renderSong(document.getElementById('mainArea'));
            }
        }

        /* ===== 候选框逻辑 ===== */
        function fetchCandidates() {
            const q = document.getElementById('trackInput').value.trim();
            const artist = document.getElementById('artistInput').value.trim();
            const dropdown = document.getElementById('candidateDropdown');

            if (!q) {
                closeDropdown();
                return;
            }

            if (candidateAbort) candidateAbort.abort();
            candidateAbort = new AbortController();

            let url = `/api/seed_candidates/?q=${encodeURIComponent(q)}`;
            if (artist) url += `&artist=${encodeURIComponent(artist)}`;

            fetch(url, { signal: candidateAbort.signal })
                .then(res => res.json())
                .then(data => {
                    const list = data.candidates || [];
                    if (list.length === 0) {
                        dropdown.innerHTML = '<div class="candidate-empty">无匹配歌曲</div>';
                        dropdown.classList.add('open');
                        return;
                    }
                    dropdown.innerHTML = list.map((c, i) => `
                        <div class="candidate-item" onclick="selectCandidate(${i})">
                            <div class="cand-name">${escapeHtml(c.track_name)}</div>
                            <div class="cand-sub">${escapeHtml(c.artist_name)}${c.artist_genres ? ' · ' + escapeHtml(c.artist_genres.split(',').slice(0,2).join(', ')) : ''}</div>
                        </div>
                    `).join('');
                    dropdown.classList.add('open');
                    window._candidates = list;
                })
                .catch(err => {
                    if (err.name === 'AbortError') return;
                    console.error('候选查询失败:', err);
                });
        }

        function selectCandidate(idx) {
            const list = window._candidates || [];
            const c = list[idx];
            if (!c) return;
            document.getElementById('trackInput').value = c.track_name;
            document.getElementById('artistInput').value = c.artist_name;
            closeDropdown();
            doRecommend(c.track_name, c.artist_name);
        }

        function closeDropdown() {
            document.getElementById('candidateDropdown').classList.remove('open');
        }

        function scheduleCandidates() {
            if (candidateTimer) clearTimeout(candidateTimer);
            candidateTimer = setTimeout(fetchCandidates, 300);
        }

        function escapeHtml(text) {
            if (!text) return '未知';
            const d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('trackInput').addEventListener('input', scheduleCandidates);
            document.getElementById('artistInput').addEventListener('input', () => {
                if (document.getElementById('trackInput').value.trim()) {
                    scheduleCandidates();
                }
            });

            document.getElementById('trackInput').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') startRecommend();
            });
            document.getElementById('artistInput').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') startRecommend();
            });

            document.addEventListener('click', (e) => {
                if (!e.target.closest('.search-box')) closeDropdown();
            });

            document.addEventListener('keydown', (e) => {
                if (currentResults.length === 0) return;
                if (e.key === 'ArrowLeft') prevSong();
                if (e.key === 'ArrowRight') nextSong();
            });

            document.getElementById('trackInput').focus();
        });
    </script>
</body>
</html>
