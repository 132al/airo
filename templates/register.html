<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 · AIRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --punch-red: #e63946ff;
            --honeydew: #f1faeeff;
            --frosted-blue: #a8dadcff;
            --cerulean: #457b9dff;
            --oxford-navy: #1d3557ff;
            --bg-deep: var(--oxford-navy);
            --bg-card: rgba(255, 255, 255, 0.04);
            --bg-card-hover: rgba(255, 255, 255, 0.08);
            --border-subtle: rgba(255, 255, 255, 0.06);
            --text-primary: var(--honeydew);
            --text-secondary: rgba(241, 250, 238, 0.70);
            --text-muted: rgba(241, 250, 238, 0.35);
            --accent: var(--punch-red);
            --accent-glow: rgba(230, 57, 70, 0.20);
            --radius-card: 16px;
            --radius-pill: 60px;
            --transition: 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image:
                radial-gradient(circle at 20px 20px, rgba(168, 218, 220, 0.10) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse at 15% 15%, rgba(230, 57, 70, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 85% 85%, rgba(69, 123, 157, 0.14) 0%, transparent 50%);
            pointer-events: none;
        }
        .auth-box {
            max-width: 400px;
            width: 100%;
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-card);
            padding: 40px 36px;
            backdrop-filter: blur(2px);
        }
        .auth-box h1 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: -0.3px;
        }
        .auth-box h1 span {
            color: var(--frosted-blue);
            font-weight: 300;
        }
        .auth-box .subtitle {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 28px;
        }
        .form-field {
            margin-bottom: 18px;
        }
        .form-field label {
            display: block;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        .form-field input {
            width: 100%;
            padding: 14px 20px;
            border-radius: var(--radius-pill);
            border: 1px solid var(--border-subtle);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-primary);
            font-size: 15px;
            outline: none;
            transition: var(--transition);
        }
        .form-field input::placeholder {
            color: var(--text-muted);
        }
        .form-field input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-glow);
        }
        .auth-btn {
            width: 100%;
            padding: 14px 32px;
            border: none;
            border-radius: var(--radius-pill);
            background: var(--accent);
            color: var(--honeydew);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 8px;
        }
        .auth-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 20px var(--accent-glow);
        }
        .auth-switch {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: var(--text-muted);
        }
        .auth-switch a {
            color: var(--frosted-blue);
            text-decoration: none;
        }
        .auth-switch a:hover {
            text-decoration: underline;
        }
        .error-list {
            background: rgba(230, 57, 70, 0.10);
            border: 1px solid rgba(230, 57, 70, 0.30);
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #ffb3b8;
        }
        .error-list ul {
            list-style: none;
            padding: 0;
        }
        .error-list li {
            margin-bottom: 4px;
        }
        .error-list li:last-child {
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <div class="auth-box">
        <h1>注册 <span>· AIRO</span></h1>
        <p class="subtitle">创建一个账号</p>

        {% if form.errors %}
            <div class="error-list">
                <ul>
                    {% for field, errors in form.errors.items %}
                        {% for error in errors %}
                            <li>{{ error }}</li>
                        {% endfor %}
                    {% endfor %}
                </ul>
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="form-field">
                <label for="{{ form.username.id_for_label }}">用户名</label>
                {{ form.username }}
            </div>
            <div class="form-field">
                <label for="{{ form.password1.id_for_label }}">密码</label>
                {{ form.password1 }}
            </div>
            <div class="form-field">
                <label for="{{ form.password2.id_for_label }}">确认密码</label>
                {{ form.password2 }}
            </div>
            <button type="submit" class="auth-btn">注册</button>
        </form>

        <div class="auth-switch">
            已有账号？<a href="/login/">去登录</a>
        </div>
    </div>
</body>
</html>
